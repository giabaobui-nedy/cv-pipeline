# Example job-ad spec. Copy this file to job-ads/<slug>/spec.yml and edit
# (slug = company plus role, e.g. metro-trains-software-engineer).
#
# How tailoring works:
# 1. Paste the raw ad into `ad_raw` (kept for grep, not rendered).
# 2. List target keywords/themes you want the CV to mirror.
# 3. Pick which bullets from each role and project to include, by `id`.
# 4. Run: python3 tools/render_tailored.py job-ads/<slug>/spec.yml
#    -> writes outputs/<slug>/cv.tex
# 5. Compile with: tools/compile.sh <slug>

company: Example Co
role: Software Engineer
source_url: https://example.com/jobs/123
date_saved: 2026-05-02

ad_raw: |
  Paste the original ad here. Free-form. Not rendered into the CV.

keywords:
  - aws
  - typescript
  - microservices

# The ad's required items as its exact phrases. tailor-cv maps each to a bullet.
basic_qualifications:
  - experience with AWS
  - TypeScript
preferred_qualifications:
  - infrastructure as code

page_mode: one        # one | two (AU enterprise, consulting, public sector)

education_bullets:
  - Recognised as \textbf{Highest Achieving Graduate} in the Bachelor of Computer Science (Professional) cohort.

# Profile paragraph for the tailored CV (replaces the master profile).
# Keep it ~3 sentences and mirror the ad's language.
profile: >-
  Junior Software Engineer and Highest Achieving Graduate in Computer Science with 2+ years of
  commercial experience building production-grade, API-driven systems. Strong
  foundation in TypeScript, distributed services, and event-driven architectures, with
  hands-on experience shipping features into live SaaS environments.

# Roles to include, newest first. `bank` names a file in bullet-bank/; the heading
# (title, dates, employer, location) comes from that file's role: block. Add any of
# those keys here only to override it. `bullets` is an ordered list of bullet IDs.
experience:
  - bank: soniq
    bullets:
      - soniq-cost-optimisation
      - soniq-outbox-pipeline-migration-compact
      - soniq-shopify-eventbridge
      - soniq-ts-frontend-architecture-compact
      - soniq-stack

  - bank: csiro
    bullets:
      - csiro-fullstack-leadership
      - csiro-locks-deployment
      - csiro-azure-sso
      - csiro-stack

# Projects to include, in display order. Each entry: project id + which of its bullets.
projects:
  - id: logistics-platform
    bullets:
      - logistics-platform-terraform

# Cover letter (optional). Omit this entire block to skip cover-letter rendering.
# Generated and refined by the `write-cover-letter` skill. ≤ 350 words across paragraphs.
cover_letter:
  company: Example Co            # defaults to top-level `company` if omitted
  recipient_name: Hiring Manager  # a named person if findable (research.md "Ad facts")
  salutation: "Dear Hiring Manager"
  # date: 2 May 2026             # optional; defaults to today
  # recipient_address: |         # optional; omit for modern AU practice
  #   Street line 1
  #   City, State Postcode
  tone: hybrid_warm_professional   # detected by the cover-letter skill
  evidence:
    technical: soniq-cost-optimisation   # bullet id used as evidence in P2
    values: csiro-collaboration          # bullet id used as evidence in P3
  paragraphs:
    hook: >-
      Reading Example Co's ad, the line about <specific detail> caught me
      because <specific reason tied to your work>. I'm applying for the
      <Role Title> role.
    technical_match: >-
      The most important technical aspect of this role is <your read of the
      ad>. At <employer> I <narrative version of the technical evidence
      bullet: outcome, not task>, which taught me <connection back to
      their need>.
    values_fit: >-
      Your ad emphasises <value/culture signal>. At <employer> I
      <behavioural story drawing on the values evidence bullet>, and that
      same instinct is what I'd bring on day one.
    forward: >-        # optional; omit for a four-paragraph letter
      In my first 90 days I'd want to <specific concrete contribution
      anchored in the ad>, and longer-term I'm interested in <specific
      angle of their domain>.
    close: >-
      Thanks for reading. I'd welcome a conversation about how I could
      contribute to the team.

# Structured skills block. Reorder/drop categories per job.
#
# IMPORTANT — write plain text here, not pre-escaped LaTeX.
# The renderer (tools/render_tailored.py) calls _latex_escape() on every
# category name and item automatically. Pre-escaping causes double-escaping:
#   BAD:  category: "Cloud \& DevOps"        -> renders as literal \& in PDF
#   BAD:  items: ["AWS (Lambda\, EventBridge)"] -> renders as literal \, in PDF
#   GOOD: category: "Cloud & DevOps"          -> renderer writes \& correctly
#   GOOD: items: ["AWS (Lambda, EventBridge)"]  -> renders as clean comma
skills:
  - category: Languages
    items: [TypeScript, Python]
  - category: Cloud & DevOps
    items: [AWS (Lambda, EventBridge, SQS, Fargate), AWS CDK, Terraform, Docker, GitHub Actions]
  - category: Backend & Data
    items: [Node.js (NestJS), FastAPI, PostgreSQL, event-driven microservices]
