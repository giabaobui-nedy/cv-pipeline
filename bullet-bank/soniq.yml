    env: [dev, staging, prod]
    metric:
      source: AWS Cost Explorer monthly CSVs (dev, staging, prod, 2026-09-11)
      baseline: prod daily spend Jun 2026; combined bill May 2026 for the 40% share
      window: Jul 2026 (cutover dev 24 Jun, staging 2 Jul, prod 3 Jul)
    tags:
      [
        aws,
        eventbridge,
        fargate,
        microservices,
        event-driven,
        cost,
        architecture,
        impact-metric,
      ]
    text: >-
      Re-architected the transactional-outbox pipeline across three environments, replacing a
      managed DMS $\rightarrow$ Kinesis $\rightarrow$ Lambda fan-out with a small poller running
      on each microservice's already-underused Fargate task that publishes straight to EventBridge.
      This removed the DMS and Kinesis spend entirely (about \textbf{40\%} of the combined bill
      across three environments) and cut production cost by \textbf{26\%} in the first full month.

  - id: soniq-outbox-index-tuning
    variant_group: outbox-index
    story: outbox
    env: [dev]
    note: >-
      Dev regression ran 19 Jun to 31 Jul 2026. A teammate's pagination-index PR landed on dev
      first and ended it; the user diagnosed the cause (CBE-399), shipped the outbox index to the
      other services and ran VACUUM FULL (CBE-403). Wording "found the cause and implemented an
      index to solve it" is user-approved; be ready to explain the teammate's PR in interview.
    metric:
      source: AWS Cost Explorer dev RDS daily spend; Jira CBE-399, CBE-403
      baseline: dev RDS daily spend before 19 Jun 2026 (1.97x during the regression)
      window: 19 Jun to 31 Jul 2026
    tags:
      [
        database,
        postgresql,
        aurora,
        query-optimisation,
        data-modelling,
        performance,
        cost,
        impact-metric,
      ]
    text: >-
      Found the cause of a six-week RDS cost regression that \textbf{doubled} dev Aurora Serverless
      spend: a once-per-second \texttt{ORDER BY created\_at} claim query was scanning a bloated
      1.7\,GB outbox table with no index to help it. Implemented a composite
      \texttt{(created\_at, id)} index as a schema migration to solve it, and reclaimed the bloated
      table from 1.7\,GB to 24\,kB.

