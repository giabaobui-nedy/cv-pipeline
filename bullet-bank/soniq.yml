# SONIQ Digital — Bullet Bank
# Role: Junior Software Engineer, Feb 2026 – Present, Richmond VIC.
#
# Each entry has:
#   id    — stable identifier referenced from job-ad specs
#   tags  — free-form theme tags, used to grep relevant bullets per ad
#   text  — LaTeX-ready content (goes inside \resumeItem{...})

bullets:
  - id: soniq-overview
    tags: [react, aws, microservices, event-driven, saas, overview]
    text: >-
      Build the React frontend and the event-driven backend microservices behind a live digital
      signage and content management platform (CMS), sold as a SaaS product and running on AWS.

  - id: soniq-collaboration
    tags:
      [
        collaboration,
        communication,
        requirements,
        stakeholders,
        microservices,
        meta,
      ]
    text: >-
      Scoped features with product managers and engineers before any code was written, agreeing
      requirements, user workflows and edge cases so work spanning several microservices started
      from one shared spec.

  - id: soniq-media-transcoding
    tags: [backend, media, pipeline, optimization, legacy]
    text: >-
      Automated 4K-to-Full-HD transcoding for a legacy CMS by building a media pipeline, so client
      uploads play back correctly and less video data ships to each site.

  - id: soniq-responsive-redesign
    tags: [frontend, responsive, css, ui, refactoring]
    text: >-
      Rebuilt several web pages mobile-first with reusable UI patterns, so they work on any screen
      size and no longer carry duplicated CSS.

  - id: soniq-aws-analysis-ts-migration
    tags: [aws, typescript, migration, architecture, analysis]
    text: >-
      Unblocked a large TypeScript migration (.js $\rightarrow$ .ts, .jsx $\rightarrow$ .tsx) that
      made the codebase type-safe and easier to maintain, by mapping and diagramming the existing
      AWS infrastructure and how each service talks to the others.

  - id: soniq-architecture-docs
    tags: [documentation, architecture, microservices, onboarding]
    text: >-
      Documented the architecture of a large microservice system in writing and diagrams, capturing
      the service flows and design patterns that until then lived only in people's heads, so new
      engineers could get up to speed on their own.

  - id: soniq-jira-workflow
    tags: [agile, delivery, team, jira]
    text: >-
      Split large Jira epics into small tasks that each ship on their own, making team progress
      visible week to week and letting work land continuously instead of in one lump.

  - id: soniq-subscription-tier
    tags: [microservices, backend, saas, entitlement]
    text: >-
      Aligned free-tier limits across distributed microservices, by fixing entitlement checks that
      disagreed with each other from service to service.

  - id: soniq-scheduling-defect
    tags: [debugging, backend, production, testing, timezone, ci-cd]
    text: >-
      Fixed a production bug where switching on monthly recurrence made timeline events disappear,
      by reproducing it with targeted tests and correcting timezone-sensitive scheduling logic,
      then added those tests to the CI/CD pipeline so it cannot come back unnoticed.
    explanation: >-
      Schedule times are stored and validated in UTC, but customers set them in local time
      (Melbourne, UTC+11). A recurring event's conflict check was comparing against the UTC
      calendar day its start time fell on, instead of the actual start/end instants. Because
      Melbourne is 11 hours ahead, a same-day local schedule spans two UTC calendar days, so the
      recurring event's inflated "occupied" window swallowed whichever neighbouring event happened
      to sit near that UTC day boundary, even though there was no real overlap. Fixed by comparing
      actual instants instead of UTC-day approximations, and added a test with events packed
      tight across a UTC day boundary so it can't regress silently.

  - id: soniq-device-protocol-migration
    tags: [iot, cloud, migration, realtime, backend]
    text: >-
      Migrated device communication onto a cloud-native synchronisation service, so data syncs
      reliably in real time across distributed signage displays and more displays can be added.

  - id: soniq-portrait-landscape
    tags: [frontend, responsive, css, iot]
    text: >-
      Added layout support for portrait (1080$\times$1920) and landscape (1920$\times$1080)
      screens, so signage renders correctly in both orientations customers mount displays in.

  - id: soniq-qa-debugging
    tags: [debugging, qa, production, reliability, ux]
    text: >-
      Cleared production issues as QA reported them, keeping live deployments stable and the UI
      predictable for customers.

  - id: soniq-hubspot-lambda
    tags: [aws, lambda, serverless, integration, crm]
    text: >-
      Routed user inquiries and notifications straight into HubSpot CRM with a serverless AWS
      Lambda service, taking manual handling out of the customer feedback loop.

  - id: soniq-cost-optimisation
    tags: [aws, lambda, eventbridge, serverless, cost, impact-metric]
    text: >-
      Cut development costs by \textbf{$\sim$20\%} and staging costs by \textbf{33\%}, by building
      an event-driven scheduling service (AWS Lambda + EventBridge) that shuts non-production
      environments down overnight and at weekends, and by fixing a cron bug that had left weekends
      running around the clock.

  - id: soniq-ts-frontend-architecture
    tags:
      [
        typescript,
        frontend,
        react,
        architecture,
        refactoring,
        leadership,
        state-management,
        tanstack,
      ]
    text: >-
      Led a TypeScript migration that gave a React frontend strict type-safe boundaries and one
      clear path for data, by standardising core Context providers (authentication, theme, layout)
      for shared state and setting a layered data flow
      (DTO $\rightarrow$ mapper $\rightarrow$ domain $\rightarrow$ API $\rightarrow$ TanStack
      $\rightarrow$ state hook).

  # OUTDATED 2026-09-03 — kept so the ~40 specs referencing this id keep rendering.
  # The previous text claimed the tooling "enforces the codebase's architectural rules and
  # fails the build when code breaks them", and that it "stopped AI-assisted development
  # eroding code quality". Neither happened: the file was built, but enforcement was never
  # switched on because the frontend architecture was still changing too much to freeze rules
  # against. That wording was an overclaim under PRINCIPLES §1 and must not be reinstated.
  # The text below is the truthful version and is what now renders everywhere.
  # Prefer the guardrail work that actually landed: soniq-styling-migration (custom
  # check-styling lint guard, advisory-first with an allowlist, then merge-blocking) and
  # soniq-component-consolidation (ESLint layering rules raised from warning to error).
  - id: soniq-architectural-validation
    status: outdated
    tags: [tooling, architecture, quality, ai-assisted, tradeoff]
    note: >-
      Superseded by the move to centralise enforcement in ESLint. Do not select for new specs
      unless the role specifically rewards judgement about when NOT to enforce a rule.
    text: >-
      Built a validator for a React/TypeScript frontend to keep AI-assisted development from
      eroding module boundaries, then held enforcement back while the architecture was still
      moving, rather than freezing rules that would have churned every refactor.

  - id: soniq-shopify-eventbridge
    tags: [aws, eventbridge, sqs, event-driven, integration, saas, onboarding]
    text: >-
      Wired Shopify webhooks into internal microservices (EventBridge + SQS) so a hardware
      purchase activates a CMS trial on its own, with no manual setup between buying the device
      and using the software.

  - id: soniq-shopify-trial-requirements
    tags:
      [
        requirements,
        stakeholders,
        communication,
        collaboration,
        ux,
        backend,
        frontend,
        saas,
      ]
    text: >-
      Converted a vague request into a written spec before any code was written, by running a
      discovery phase with the managing director and the engineering team on the business context,
      the scope and the UX limits of a Shopify-to-CMS trial activation system.

  - id: soniq-stripe-trial-activation
    tags:
      [stripe, backend, billing, saas, entitlement, integration, reliability]
    text: >-
      Built the Stripe trial activation flow in the billing service so customers can start a
      Business Tier trial without entering card details, using deterministic idempotency keys to
      stop a duplicate Stripe customer being created between signup and activation.

  - id: soniq-activation-claim-page
    tags: [frontend, react, ux, ui, fullstack, saas, onboarding]
    text: >-
      Turned a Shopify hardware purchase into an active CMS Business Tier trial in one email-driven
      step, by building the claim page and the flow behind it: token validation, authentication
      round-trips, account eligibility checks and trial confirmation UI. Deployed to the
      development environment.

  - id: soniq-claude-code-jira
    tags: [ai-assisted, agentic, tooling, jira, coordination, planning]
    text: >-
      Translated decisions from engineering discussions into PR-ready plans with ordered Jira tasks
      and delivery dates, using Claude Code with Jira MCP connectors, so the reasoning behind each
      decision stayed attached to the work.

  - id: soniq-event-propagation-debug
    tags: [debugging, event-driven, microservices, backend, aws, observability]
    text: >-
      Traced why new customers could not activate the CMS (hardware bought on Shopify, activation
      code received, claim flow silently doing nothing) by walking the flow end to end as a new
      customer and reading CloudWatch logs across the billing and IAM microservices,
      finding a JWT minter rewrite that had renamed the IAM identity-sync event topic and cut
      billing's subscription, so customer identity never synced; then fixed the subscription and
      raised the rename with the engineer who made it, so the new event was checked against every
      consumer with no old event shape left behind.

  - id: soniq-event-propagation-debug-compact
    tags:
      [
        debugging,
        event-driven,
        microservices,
        backend,
        aws,
        observability,
        incident-response,
      ]
    text: >-
      Restored a customer activation flow that was silently broken in production, by tracing
      CloudWatch logs across the billing and IAM microservices to a renamed event topic that had
      cut a service's subscription, then raising it so the new event was checked against every
      consumer.

  - id: soniq-event-propagation-debug-versioning
    tags:
      [
        debugging,
        event-driven,
        microservices,
        backend,
        aws,
        observability,
        incident-response,
        reliability,
      ]
    text: >-
      Restored a customer activation flow that was silently broken in production, by tracing
      CloudWatch logs across the billing and IAM microservices to a renamed event topic that had
      cut a service's subscription, then got event-topic renames treated as a breaking change
      that needs explicit versioning.

  - id: soniq-device-grouping
    tags:
      [
        fullstack,
        frontend,
        backend,
        react,
        fastapi,
        typescript,
        feature-delivery,
        ai-assisted,
      ]
    text: >-
      Shipped device grouping end to end, so users can filter and manage devices in bulk by group,
      by adding a group field to the FastAPI data model, building group CRUD and bulk
      assign/unassign APIs, and building the React UI: a group filter rail, colour-coded chips,
      contextual action bars, multi-select, and a React Table device grid.

  - id: soniq-fallback-content
    tags: [backend, frontend, react, fastapi, scheduling, saas, reliability]
    text: >-
      Kept screens from going blank when schedules overlap or run out, by replacing server-side
      conflict checking with priority-based playback resolution and a per-schedule fallback field
      (FastAPI), and building the schedule editor UI: priority selector, fallback-create prompt
      with an explanatory banner, and a soft warning on overlapping events.

  - id: soniq-frontend-design-system
    tags:
      [
        frontend,
        react,
        typescript,
        ui,
        design-system,
        refactoring,
        architecture,
      ]
    text: >-
      Standardised how the UI looks and behaves across the codebase with a design-system layer:
      Apple-inspired semantic type and colour tokens, fixed control and icon sizes via CVA, shared
      presentational primitives (Badge, EmptyState, StatusDot, list shell), and form layout
      components (Field, Stack).

  - id: soniq-hospital-app-accessibility
    tags: [frontend, aws, accessibility, ui, client-delivery]
    text: >-
      Reworked a client-facing hospital directory app (AWS Amplify) for readability and touch use:
      applied WCAG colour-contrast rules, added alternating row colours, standardised type and
      spacing across multi-level directory views, and added touch affordances, all shaped by
      rounds of client and management feedback.

  - id: soniq-outbox-pipeline-migration
    tags:
      [
        aws,
        eventbridge,
        fargate,
        microservices,
        event-driven,
        cost,
        architecture,
        impact-metric,
      ]
    text: >-
      Re-architected the transactional-outbox pipeline across three environments, replacing a
      managed DMS $\rightarrow$ Kinesis $\rightarrow$ Lambda fan-out with a small poller running
      on each microservice's already-underused Fargate task that publishes straight to EventBridge.
      This removed $\sim$\$1.3k/month of DMS and Kinesis spend and cut total cloud cost by
      \textbf{$\sim$26\%} month-over-month (trending to $\sim$40\% once the teardown finished).

  - id: soniq-outbox-index-tuning
    tags:
      [
        database,
        postgres,
        aurora,
        query-optimisation,
        data-modelling,
        performance,
        cost,
        impact-metric,
      ]
    text: >-
      Indexed a bloated 1.7\,GB outbox table to clear an RDS cost and performance regression: a
      once-per-second \texttt{ORDER BY created\_at} claim query was scanning the whole table with
      no index to help it, holding an Aurora Serverless cluster at \textbf{5$\times$} its idle
      capacity all day. Shipped a composite \texttt{(created\_at, id)} index as a schema migration
      across four services and twelve databases and documented it in the shared poller package,
      stopping the same failure at production scale.

  - id: soniq-outbox-shared-library-rollout
    tags:
      [
        aws,
        fargate,
        microservices,
        event-driven,
        refactoring,
        shared-library,
        architecture,
        cost,
      ]
    text: >-
      Consolidated three copies of the outbox poller that had drifted apart into one versioned
      shared package used by four microservices, and collapsed per-worker Fargate tasks behind a
      config-driven async supervisor, finishing the transactional-outbox teardown.

  - id: soniq-styling-migration
    tags:
      [
        frontend,
        react,
        design-system,
        refactoring,
        tooling,
        code-quality,
        ci-cd,
        migration,
      ]
    text: >-
      Moved a production React codebase off ad-hoc styling onto a central token system, ending
      with zero offenders left and a merge-blocking check, by writing a custom
      \texttt{check-styling} lint guard, shipping it advisory-first with an allowlist so CI stayed
      green, then stripping inline styles, raw hex colours and arbitrary pixel utilities feature
      by feature.

  - id: soniq-component-consolidation
    tags:
      [frontend, react, architecture, refactoring, design-system, code-quality]
    text: >-
      Merged two parallel React component libraries into one barrel-exported hierarchy
      (primitives / composites / dialogs), retiring six duplicated components across $\sim$80
      files in small steps that changed no behaviour, and locked the layering in as ESLint rules
      raised from warning to error once the last compatibility shim was deleted.

