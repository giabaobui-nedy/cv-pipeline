# CSIRO bullet bank. Field reference: bullet-bank/README.md.
# Intern then casual (part-time) role: be ready to say so when YoE is probed.

role:
  title: Software Engineering Intern / Casual Software Engineer
  employer: CSIRO
  dates: Mar 2024 -- Jun 2025
  start: 2024-03
  end: 2025-06
  location: Clayton, VIC

bullets:
  - id: csiro-overview
    tags: [architecture, fullstack, telemetry, auth, overview]
    text: >-
      Architected and delivered a production lab automation system for a group of research
      scientists, combining real-time telemetry, firmware control and secure login, so experiments
      once run by hand now run automated and logged. Built within a multi-disciplinary engineering
      team.

  - id: csiro-fullstack-leadership
    tags: [fullstack, vue, nuxt, node, sql, influxdb, leadership]
    text: >-
      Enabled remote hardware control and live monitoring in a production laboratory, by leading
      full-stack development across a Vue/Nuxt frontend, Node-based services, a firmware
      interface, and SQL/InfluxDB databases.

  - id: csiro-firmware-abstraction
    story: csiro-hardware-layer
    tags: [firmware, modbus, architecture, backend, hardware]
    text: >-
      Designed a configuration-driven firmware abstraction layer (UI $\rightarrow$ server
      $\rightarrow$ firmware $\rightarrow$ Modbus hardware) that replaced hard-wired single-device
      bindings, so new multi-column hardware setups need a configuration change, not a refactor.

  - id: csiro-pragmatic-tradeoff
    story: csiro-hardware-layer
    tags: [pragmatism, decision-making, architecture, hardware, tradeoff]
    text: >-
      Chose to invest in a reusable, configuration-driven hardware interface over a faster
      hardcoded API when a second control-box configuration arrived, trading longer initial
      delivery for unblocking the team's electronics engineer to continue R\&D on the control
      box without repeat rework.

  - id: csiro-vue-refactor
    variant_group: csiro-vue-refactor
    tags: [vue, frontend, refactoring, architecture, recognition]
    text: >-
      Refactored a large Vue.js frontend into a structure a fellow engineer commended for its
      maintainability and developer experience, by enforcing a presentational/container pattern
      that isolated API logic to page-level components and kept UI components pure and
      prop-driven.

  - id: csiro-vue-refactor-review
    variant_group: csiro-vue-refactor
    tags: [vue, frontend, code-review, refactoring, architecture, code-quality, recognition]
    text: >-
      Reviewed the code of a large Vue.js frontend, then restructured it with a
      presentational/container pattern: API logic lives only in page-level components, and UI
      components stay pure and prop-driven. A fellow engineer commended the result for its
      maintainability.

  - id: csiro-db-redesign
    tags: [database, sql, schema-design, audit]
    text: >-
      Redesigned and normalised the relational schema to model experiment lifecycles, user roles
      and versioned comments, giving the lab an audit trail of comment edits on every experiment.

  - id: csiro-influx-echarts
    tags: [influxdb, websockets, realtime, frontend, telemetry, visualisation]
    text: >-
      Integrated real-time InfluxDB telemetry with dynamic ECharts visualisations and WebSocket
      updates via custom SVG components, enabling efficient time-range filtering and accurate
      experiment monitoring without page reload.

  - id: csiro-oop-hardware
    story: csiro-hardware-layer
    tags: [oop, backend, hardware, architecture]
    text: >-
      Applied OOP principles (inheritance and abstraction) to reuse hardware communication logic
      and extend software classes for different hardware configurations, improving scalability
      across multiple control systems.

  - id: csiro-locks-deployment
    metric:
      source: unverified (the user's account of the three-month continuous run)
    tags: [concurrency, threading, firmware, reliability, impact-metric, hardware]
    text: >-
      Implemented safe, correct lock mechanisms to prevent concurrent access to the hardware
      and firmware-level caching to minimise hardware interference, contributing to stable
      three-month continuous production operation in a live laboratory setting.

  - id: csiro-api-logging
    tags: [api, logging, reliability, maintenance, backend]
    text: >-
      Kept the system stable through iterative production use in a live laboratory by refining the
      API design, introducing structured logging and adding defensive error handling.

  - id: csiro-azure-sso
    tags: [auth, sso, azure, security, middleware]
    text: >-
      Implemented Azure Entra ID SSO and middleware-based role authorisation to enforce secure
      access control across the application, aligning the platform with institutional security
      standards.

  - id: csiro-docker-ssh
    tags: [docker, devops, deployment, linux]
    text: >-
      Containerised services using Docker and deployed to CSIRO's internal hosting environment
      via SSH, for reproducible builds and consistent runtime configuration.

  - id: csiro-refinery-rn
    tags: [react-native, ui, ux, mobile, leadership, industrial]
    text: >-
      Led the UI/UX redesign and domain analysis for a real-time refinery operations platform,
      translating operator requirements into a mobile-first React Native prototype to optimise
      industrial workflows and on-site monitoring.

  - id: csiro-cross-platform-eval
    tags: [research, mobile, architecture, evaluation]
    text: >-
      Conducted structured evaluation of cross-platform technologies (Flutter, .NET MAUI, React
      Native), guiding architectural decisions based on performance, maintainability, and alignment
      with the existing tech stacks.

  - id: csiro-sdlc
    tags: [sdlc, documentation, process, jira, git]
    text: >-
      Ran the project through the full SDLC (requirements analysis, iterative prototypes, Jira
      tracking, Git, formal SRS/SDD documents, commissioning support and knowledge transfer) so the
      lab could maintain the system after handover.

  - id: csiro-collaboration
    tags: [collaboration, stakeholders, communication, hardware]
    text: >-
      Worked with researchers, electronics engineers and external vendors to match software
      behaviour to hardware capabilities, supporting commissioning and a safe handover of the
      laboratory.

  - id: csiro-demos
    variant_group: csiro-demos
    tags: [communication, leadership, stakeholders]
    text: >-
      Led technical demonstrations for internal leadership, visiting industry partners and national
      intern cohorts, explaining the system's architecture decisions and what applied software
      engineering adds to mineral processing research.

  - id: csiro-onboarding-handover
    variant_group: csiro-onboarding-handover
    tags: [documentation, onboarding, knowledge-transfer, leadership, communication]
    text: >-
      Produced a handover suite at system completion: SRS/SDD documentation from frontend to
      backend, UML architecture diagrams used to brief a mechatronics engineer who will onboard
      future developers, and a step-by-step deployment tutorial co-recorded with the team lead, so
      the system can be rebuilt end to end.

  - id: csiro-accessibility-ux
    tags: [accessibility, ux, frontend, aria, css, mobile, ui]
    text: >-
      Made the web and mobile interfaces more accessible and consistent by adding ARIA labels,
      enforcing colour-contrast standards, and standardising typography, component styles and
      interactive patterns.

  - id: csiro-figma-prototype
    variant_group: csiro-figma-prototype
    tags: [figma, prototyping, mobile, ux, stakeholders, requirements, ui]
    text: >-
      Designed a Figma prototype with variable-driven state management and dynamic view transitions
      to distil the most operationally critical data from an existing desktop system into a
      mobile-first interface for operators working in a constrained, hazardous on-site environment,
      clarifying scope and aligning the industry partner on layout and data load before React Native
      development began.

  - id: csiro-stack
    tags: [stack, python, flask, vue, nuxt, react-native, postgresql, influxdb, docker, azure, tailwind]
    text: >-
      \textbf{Stack:} \emph{Python (Flask, threading), JavaScript/TypeScript (Vue, Nuxt, Node),
      React Native, Tailwind CSS, PostgreSQL, InfluxDB, Modbus, Docker Compose, Git/GitHub, Linux,
      Azure Entra ID (SSO), ECharts, WebSockets.}

  - id: csiro-demos-fifteen-minutes
    variant_group: csiro-demos
    tags: [communication, knowledge-sharing, stakeholders, presentation]
    note: >-
      Confirmed by user 2026-09-13. Specific variant of csiro-demos ("national intern cohorts").
      Use one or the other, never both.
    text: >-
      Presented my placement contributions to two of the Electrical Connections team's projects
      at CSIRO's national ``15 Minutes of Fame'' event for summer students and interns.

  - id: csiro-onboarding-handover-compact
    variant_group: csiro-onboarding-handover
    tags: [documentation, onboarding, knowledge-transfer]
    text: >-
      Produced the handover suite at system completion: SRS/SDD documents, UML architecture
      diagrams and a deployment tutorial co-recorded with the team lead, so the system can be
      rebuilt end to end.

  - id: csiro-figma-prototype-compact
    variant_group: csiro-figma-prototype
    tags: [figma, prototyping, mobile, ux, stakeholders]
    text: >-
      Designed a Figma prototype that distilled a desktop system's most critical data into a
      mobile-first interface for operators on a hazardous site, aligning the industry partner on
      scope before React Native development.
